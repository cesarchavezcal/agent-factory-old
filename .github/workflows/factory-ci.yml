name: Agent Factory Template CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify-factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Factory Doctor (cesarchavezcal + Claude-Free + Zero-Key Check)
        run: npm run doctor
      - name: Run Orchestrator & Gate Suite
        run: npm test
